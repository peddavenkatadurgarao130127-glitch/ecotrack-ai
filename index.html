<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoTrack AI 2</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6EEF0;--ink:#0F2A33;--mute:#4F6770;--card:#F7FAFA;--line:#C3D3D8;--green:#1E7F5C;--amber:#E39B0B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:1.3rem;margin:0;font-weight:800}
h2{font-size:1.4rem;margin:0 0 12px}
button,input,select{font:inherit}
button{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600}
button.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
input[type=text],input[type=number]{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
label{display:block;font-size:.9rem;color:var(--mute);margin-bottom:10px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;margin:28px 0}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.big{font-size:clamp(4rem,12vw,7.5rem);font-weight:800;line-height:.95;letter-spacing:-.04em;margin:0}
.big small{font-size:1.1rem;font-weight:600;color:var(--mute);letter-spacing:0}
.bars{margin:18px 0}
.bar{display:grid;grid-template-columns:90px 1fr 56px;gap:10px;align-items:center;font-size:.9rem;margin:6px 0}
.bar i{display:block;height:12px;border-radius:6px;background:var(--green);transition:width .35s}
.bar:nth-child(2) i{background:var(--amber)}.bar:nth-child(3) i{background:#2B6E9E}.bar:nth-child(4) i{background:var(--mute)}
.tabs{display:flex;gap:8px;margin:34px 0 14px;flex-wrap:wrap}
.tabs button{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.stat b{display:block;font-size:2rem;font-weight:800}
.muted{color:var(--mute);font-size:.9rem}
.spark{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:8px}
.spark span{flex:1;background:var(--green);border-radius:4px 4px 0 0;min-height:3px}
dialog{border:0;border-radius:14px;padding:24px;max-width:380px;width:90%;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(15,42,51,.55)}
.err{color:#B3261E;font-size:.9rem;min-height:1.2em}
@media(max-width:800px){.hero{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>EcoTrack AI 2</h1>
  <div><span id="who" class="muted"></span> <button class="alt" id="loginBtn">Sign in</button></div>
</header>

<section class="hero">
  <div>
    <p class="big"><span id="liveTotal">0</span> <small>kg CO₂e per week</small></p>
    <p class="muted" style="max-width:44ch">That is your footprint from travel, home energy, food and waste. Change the numbers and watch it move.</p>
    <div class="bars" id="bars"></div>
    <button id="saveBtn">Save and get tips</button>
    <div id="tips" style="margin-top:18px"></div>
  </div>
  <div class="panel">
    <h2>Your week</h2>
    <div class="grid2">
      <label>Car (km)<input type="number" min="0" id="car_km" value="30"></label>
      <label>Bus or train (km)<input type="number" min="0" id="bus_km" value="20"></label>
      <label>Two-wheeler (km)<input type="number" min="0" id="bike_km" value="0"></label>
      <label>Electricity (kWh per month)<input type="number" min="0" id="kwh" value="120"></label>
      <label>LPG (kg per month)<input type="number" min="0" id="lpg_kg" value="6"></label>
      <label>Waste (kg per week)<input type="number" min="0" id="waste_kg" value="3"></label>
      <label>Meat meals per week<input type="number" min="0" id="meat_meals" value="3"></label>
      <label>Vegetarian meals per week<input type="number" min="0" id="veg_meals" value="18"></label>
    </div>
  </div>
</section>

<div class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-t="dash">Dashboard</button>
  <button role="tab" aria-selected="false" data-t="chal">Challenges</button>
  <button role="tab" aria-selected="false" data-t="lead">Leaderboard</button>
</div>
<section class="panel" id="view"></section>
</div>

<dialog id="dlg">
  <h2>Sign in</h2>
  <label>Name<input type="text" id="name"></label>
  <label>College<input type="text" id="college"></label>
  <div class="err" id="err"></div>
  <button id="go">Continue</button> <button class="alt" id="cancel">Cancel</button>
</dialog>

<script>
const $=id=>document.getElementById(id);
const F={car_km:.17,bus_km:.08,bike_km:.07,kwh:.82/4.3,lpg_kg:3/4.3,meat_meals:2.5,veg_meals:.9,waste_kg:.45};
const cats={transport:["car_km","bus_km","bike_km"],energy:["kwh","lpg_kg"],food:["meat_meals","veg_meals"],waste:["waste_kg"]};
let user=null,tab="dash";
try{user=JSON.parse(localStorage.getItem("eco_user"))}catch(e){}

const val=k=>Math.max(parseFloat($(k).value)||0,0);
function inputs(){const o={};Object.values(cats).flat().forEach(k=>o[k]=val(k));return o}
function api(path,body){
  return fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:undefined)
    .then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error||"Request failed");return j});
}

function preview(){
  const parts={};let total=0;
  for(const c in cats){parts[c]=cats[c].reduce((s,k)=>s+val(k)*F[k],0);total+=parts[c]}
  $("liveTotal").textContent=total.toFixed(0);
  const max=Math.max(...Object.values(parts),1);
  $("bars").innerHTML=Object.entries(parts).map(([c,v])=>
    `<div class="bar"><span>${c[0].toUpperCase()+c.slice(1)}</span><i style="width:${v/max*100}%"></i><span>${v.toFixed(1)} kg</span></div>`).join("");
}
document.querySelectorAll(".panel input").forEach(i=>i.addEventListener("input",preview));

function needUser(){if(!user){$("dlg").showModal();return false}return true}

$("saveBtn").onclick=async()=>{
  if(!needUser())return;
  try{
    const r=await api("/api/footprint",{...inputs(),user_id:user.id,college:user.college});
    $("tips").innerHTML="<h2>What to try next</h2>"+r.recommendations.map(t=>
      `<div class="row"><span>${esc(t.tip)}<br><span class="muted">${esc(t.category)}</span></span><span>saves about ${t.kg_saved_week} kg/week</span></div>`).join("");
    render();
  }catch(e){$("tips").textContent=e.message}
};

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function render(){
  const v=$("view");
  if(tab==="dash"){
    if(!user){v.innerHTML='<p>Sign in to save your footprint and track progress.</p>';return}
    const d=await api("/api/dashboard/"+user.id);
    const max=Math.max(...d.history,1);
    v.innerHTML=`<div class="stats">
      <div class="stat"><b>${d.total_saved} kg</b><span class="muted">avoided in total</span></div>
      <div class="stat"><b>${d.week_saved} kg</b><span class="muted">avoided this week</span></div>
      <div class="stat"><b>${d.action_count}</b><span class="muted">actions completed</span></div></div>
      <h2>Weekly footprint</h2>
      ${d.history.length?`<div class="spark">${d.history.map(h=>`<span title="${h} kg" style="height:${h/max*100}%"></span>`).join("")}</div>`:'<p class="muted">No saved footprint yet. Fill in your week above and select Save and get tips.</p>'}
      <h2 style="margin-top:20px">Recent actions</h2>
      ${d.recent.map(a=>`<div class="row"><span>${esc(a.label)}</span><span>${a.kg_saved} kg</span></div>`).join("")||'<p class="muted">Complete a challenge to see it here.</p>'}`;
  }else if(tab==="chal"){
    const list=await api("/api/challenges");
    v.innerHTML="<h2>Challenges</h2>"+list.map(c=>
      `<div class="row"><span><b>${esc(c.title)}</b><br><span class="muted">${esc(c.desc)}</span></span>
      <button data-c="${c.id}">Mark done (${c.kg} kg)</button></div>`).join("");
    v.querySelectorAll("button[data-c]").forEach(b=>b.onclick=async()=>{
      if(!needUser())return;
      await api("/api/actions",{user_id:user.id,challenge_id:+b.dataset.c});
      b.textContent="Logged";b.disabled=true;
    });
  }else{
    const l=await api("/api/leaderboard");
    v.innerHTML=`<h2>Colleges</h2>`+(l.colleges.map(c=>`<div class="row"><span>${esc(c.college)} <span class="muted">${c.members} members</span></span><b>${c.saved} kg</b></div>`).join("")||'<p class="muted">No colleges yet.</p>')+
      `<h2 style="margin-top:20px">Top individuals</h2>`+(l.people.map(p=>`<div class="row"><span>${esc(p.name)} <span class="muted">${esc(p.college)}</span></span><b>${p.saved} kg</b></div>`).join("")||"");
  }
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));render();
});

function header(){$("who").textContent=user?`${user.name}, ${user.college}`:"";$("loginBtn").textContent=user?"Switch user":"Sign in"}
$("loginBtn").onclick=()=>$("dlg").showModal();
$("cancel").onclick=()=>$("dlg").close();
$("go").onclick=async()=>{
  try{
    user=await api("/api/login",{name:$("name").value,college:$("college").value});
    try{localStorage.setItem("eco_user",JSON.stringify(user))}catch(e){}
    $("dlg").close();header();render();
  }catch(e){$("err").textContent=e.message}
};
header();preview();render();
</script>
</body>
</html>
